<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x30343a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
const view = (q.get('view') || '1').split(',').map(Number);
const loader = new GLTFLoader(); const d = new DRACOLoader(); d.setDecoderPath('/draco/'); loader.setDRACOLoader(d);
loader.load(q.get('m'), (g) => {
  scene.add(g.scene);
  const hl = (q.get('hl') || '').split(',').filter(Boolean);
  const cols = [0xff00ff, 0x00ffff, 0xffff00, 0x00ff00, 0xff6600, 0x0066ff];
  g.scene.traverse((o) => { const i = hl.map((h) => THREE.PropertyBinding.sanitizeNodeName(h)).indexOf(o.name); if (i >= 0 && o.isMesh) o.material = new THREE.MeshBasicMaterial({ color: cols[i % cols.length] }); });
  const box = new THREE.Box3().setFromObject(g.scene); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3()).length();
  const a = view[0] ?? 1, h = view[1] ?? 0.35, dist = view[2] ?? 1;
  cam.position.set(c.x + Math.sin(a) * s * dist, c.y + s * h * dist, c.z + Math.cos(a) * s * dist); cam.lookAt(c);
  renderer.render(scene, cam); document.title = 'ready';
}, undefined, (e) => { document.title = 'error ' + e; });
</script></body></html>
